function ensureFacilityTick(){if(tick)return;tick=setInterval(()=>{if(state.screen!=='facility'||state.modal)return;const i=state.facilityIndex;if(!state.selectedFacilities.includes(i))return;const duration=facilityDuration();state.facilityProgress[i]=Math.min(duration,(state.facilityProgress[i]||0)+.2);renderFacility();if(state.facilityProgress[i]>=duration){clearInterval(tick);tick=null;toast('设施重启完成 · 已启用');}},200);}
function renderResult(){const won=state.victory;$('#content').innerHTML=`<section class="view result entry"><div class="result-art hero">${hero(roleData[state.role].id,roleData[state.role].color)}</div><div class="result-body"><span class="eyebrow">${won?'EXPEDITION COMPLETE':'THE LIGHT WILL RETURN'}</span><h1>${won?'星光长存':'余烬未熄'}</h1><p class="muted">${won?'核心守卫已击败。观测站，重新看见了星空。':'镜眼术士的弹幕终止了这次探索。下次，试试保留一次冲刺。'}</p><div class="result-summary"><div class="fine">生存时间<strong>${won?'10:08':'08:42'}</strong></div><div class="fine">击败敌人<strong>${won?'672':'384'}</strong></div><div class="fine">重启设施<strong>02 / 02</strong></div></div><div class="result-build"><span>✧ 折光星雨</span><span>◉ 双层星环</span><span>◎ 引力新星 Lv.4</span></div><div class="result-reward"><span class="fine">带回营地的星砂<br>时间 · 击败 · 设施${won?' · 胜利':''}</span><strong>+${won?'83':'61'} <span style="font-size:17px">✦</span></strong></div><div class="result-buttons"><button class="primary" data-action="claim">返回营地 <span>→</span></button><button class="secondary" data-action="again">调整配置，再出发</button></div><button class="textbtn" style="font-size:12px;margin-top:22px" data-action="result-toggle">切换${won?'失败':'胜利'}状态预览</button></div></section>`;}
function showModal(type){state.modal=type;let html='';if(type==='pause')html=`<h1>时光暂歇</h1><p>战斗、弹幕、占点与计时均已暂停。</p><div class="menu-list"><button class="primary" data-action="close">继续探索 <span>P</span></button><button class="secondary" data-action="settings">声音与显示</button><button class="textbtn" data-action="abandon">放弃本局，返回营地</button><span class="fine">放弃本局不会获得星砂或解锁进度。</span></div>`;else if(type==='settings')html=`<h1>声音与显示</h1><p>设置仅作用于界面原型，不会修改游戏配置。</p><div class="row"><label for="volume">总音量</label><input id="volume" type="range" min="0" max="100" value="65" aria-label="总音量"><output id="volume-label">65%</output></div><div class="row"><label for="motion">减少动态效果</label><input id="motion" type="checkbox" ${motionReduced?'checked':''}></div><div class="row"><span class="fine">显示</span><span class="fine">跟随浏览器窗口等比缩放</span></div><button class="primary" style="width:100%;margin-top:24px" data-action="close">完成 <span>✓</span></button>`;else if(type==='core'){const cost=[30,50,80,120,170][state.rank];html=`<h1>营地核心</h1><p>微小但可靠的成长。默认核心等级零也应能够通关。</p><div class="row"><span>当前等级</span><span class="gold">Lv.${state.rank} / 5</span></div><div class="row"><span>已有收益</span><span class="mint">生命 +${state.rank*3} / 伤害 +${state.rank*2}%</span></div><div class="row"><span>持有星砂</span><span class="gold mono">${state.crystals}</span></div><p>下一级：最大生命 +3，伤害 +2%。</p><button class="primary" data-action="buy" style="width:100%" ${state.rank>=5||state.crystals<cost?'disabled':''}>${state.rank>=5?'核心已满级':`强化核心 · ${cost} 星砂`} <span>✦</span></button><button class="textbtn" data-action="close" style="margin-top:18px">返回营地</button>`;}else if(type==='abandon')html=`<h1>结束这次探索？</h1><p>本局不会结算星砂，也不会记录新的解锁。已有营地进度保留。</p><div class="menu-list"><button class="primary" data-action="close">继续探索 <span>→</span></button><button class="secondary" data-go="camp">确认放弃，返回营地</button></div>`;else html=`<h1>武器与进化档案</h1><p>三件武器 · 四件模块。满足条件后使用星核碎片进化。</p>${[['星辉弹','聚光镜','折光星雨'],['环刃','稳定轴','双层星环'],['引力新星','引力匣','坍缩之井'],['锚灯炮台','备用电池','巡航灯塔']].map(([w,m,e])=>`<div class="row"><div>${w}<div class="fine">武器 Lv.6 + ${m} Lv.3 + 碎片 ×1</div></div><span class="gold">${e}</span></div>`).join('')}<button class="primary" style="width:100%;margin-top:25px" data-action="close">返回 <span>↩</span></button>`;
$('#modal-root').innerHTML=`<div class="shade"><section class="compact entry" role="dialog" aria-modal="true" aria-label="${({pause:"暂停",settings:"声音与显示",core:"营地核心",abandon:"放弃本局确认",archive:"武器与进化档案"})[type]}">${html}</section></div>`;setTimeout(()=>$('#modal-root button')?.focus(),0);}
function closeModal(){state.modal=null;render();$('.battle-actions button[data-action="pause"]')?.focus();}
function pickUpgrade(i){state.upgraded=i===0||state.upgraded;go('battle');toast(['星辉弹升至 Lv.6 · 已满足折光星雨等级条件','稳定轴升至 Lv.3 · 全局冷却缩短 12%','生命纤维升至 Lv.2 · 最大生命 +10'][i]);}
function start(){state.rerolls=1;state.offers=[0,1,2];state.upgraded=false;state.evolved=false;state.paid=false;state.selectedFacilities=[];state.facilityProgress={};go('battle');toast(`已选 ${roleData[state.role].name} / ${state.weapon} · 当前展示中局 HUD 布局`);}
function action(a){if(['archive','settings','core','pause','abandon'].includes(a)){showModal(a);return;}if(a==='close'){closeModal();return;}if(a==='start'){start();return;}if(a==='again'){state.paid=false;go('roles');return;}if(a==='buy'){const cost=[30,50,80,120,170][state.rank];if(state.rank<5&&state.crystals>=cost){state.crystals-=cost;state.rank++;showModal('core');toast('核心强化完成 · 仅更新演示档案');}return;}if(a==='claim'){if(!state.paid){state.crystals+=state.victory?83:61;state.paid=true;}go('camp');return;}if(a==='result-toggle'){state.victory=!state.victory;state.paid=false;render();return;}if(a==='reroll'&&state.rerolls){state.rerolls--;state.offers=[2,0,1];renderUpgrade();toast('已重抽 · 原型展示备用排序，剩余 0 次');return;}if(a==='evolve'){state.evolved=true;go('battle');toast('折光星雨已进化 · 保留原武器槽');return;}if(a==='dash'){toast('冲刺反馈预览 · 正式游戏持续 0.18 秒');return;}if(a==='activate'){const i=state.facilityIndex;if(state.selectedFacilities.includes(i)||state.selectedFacilities.length>=2)return;state.selectedFacilities.push(i);state.facilityProgress[i]=0;render();ensureFacilityTick();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go)go(b.dataset.go);else if(b.dataset.action)action(b.dataset.action);else if(b.dataset.role!==undefined){state.role=+b.dataset.role;state.weapon=roleData[state.role].weapon;render();}else if(b.dataset.weapon){state.weapon=b.dataset.weapon;render();}else if(b.dataset.upgrade!==undefined)pickUpgrade(+b.dataset.upgrade);else if(b.dataset.facility!==undefined){clearInterval(tick);tick=null;state.facilityIndex=+b.dataset.facility;renderFacility();}});
document.addEventListener('change',e=>{if(e.target.id==='motion'){motionReduced=e.target.checked;$('.stage').classList.toggle('reduce-motion',motionReduced);}});
document.addEventListener('input',e=>{if(e.target.id==='volume')$('#volume-label').textContent=e.target.value+'%';});
document.addEventListener('keydown',e=>{if(!state.modal&&state.screen==='roles'&&e.target.closest?.('[data-role]')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[e.key];const focusedRole=Number(e.target.closest('[data-role]').dataset.role);state.role=Math.max(0,Math.min(roleData.length-1,focusedRole+delta));state.weapon=roleData[state.role].weapon;render();document.querySelector(`[data-role="${state.role}"]`).focus();return;}if(e.key==='Tab'&&document.querySelector('.shade')){const items=[...$('#modal-root').querySelectorAll('button:not(:disabled),input')];const first=items[0],last=items.at(-1);if((e.shiftKey&&document.activeElement===first)||(!e.shiftKey&&document.activeElement===last)){e.preventDefault();(e.shiftKey?last:first)?.focus();return;}}if(e.target instanceof HTMLInputElement&&e.key!=='Escape')return;if(state.modal){if(e.key==='Escape'||e.key.toLowerCase()==='p'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const items=[...$('#modal-root').querySelectorAll('button:not(:disabled),input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(state.screen==='upgrade'&&['1','2','3'].includes(e.key)){e.preventDefault();pickUpgrade(state.offers[+e.key-1]);}else if(['battle','facility'].includes(state.screen)&&(e.key.toLowerCase()==='p'||e.key==='Escape')){e.preventDefault();showModal('pause');}else if(state.screen==='battle'&&e.key==='Tab'){e.preventDefault();showModal('archive');}else if(e.key==='Escape'&&state.screen==='roles'){go('camp');}});
function fit(){const width=$('.frame').clientWidth;$('.stage').style.transform=`scale(${width/1440})`;}
window.addEventListener('resize',fit);fit();
const characterImages={};
for(const role of roleData){
    const kind=role.id, old={starmapper:'jiyue',robot:'luodeng'}[kind];
    const image=new Image();characterImages[kind]=image;
    image.onload=()=>drawWorld(state.screen);
    image.src=old?`../../output/imagegen/characters-v002/${old}-sprite-96.png`:`../../output/imagegen/characters-v004/${kind}-sprite-96.png`;
}
function drawWorld(screen){const c=$('#world'),ctx=c.getContext('2d');ctx.clearRect(0,0,1440,900);let seed=41;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};ctx.fillStyle='#13271e';ctx.fillRect(0,0,1440,900);for(let i=0;i<2800;i++){const x=rand()*1440,y=rand()*900;ctx.fillStyle=['#203629','#1b3025','#31422a','#0c2119'][i%4];ctx.fillRect(x,y,1+rand()*5,1+rand()*3);}const camp=['camp','roles','result'].includes(screen);const ox=camp?960:710,oy=camp?600:485;ctx.save();ctx.translate(ox,oy);ctx.scale(1,.58);for(let r=180;r<=440;r+=85){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=r===350?'#87915b77':'#596b4166';ctx.lineWidth=r===350?7:3;ctx.stroke();}for(let i=0;i<16;i++){const a=i*Math.PI/8;ctx.save();ctx.rotate(a);ctx.fillStyle='#87966577';ctx.fillRect(275,-3,17,6);ctx.strokeStyle='#76845c33';ctx.beginPath();ctx.moveTo(125,0);ctx.lineTo(350,0);ctx.stroke();ctx.restore();}ctx.restore();
for(let i=0;i<30;i++){const x=rand()*1440,y=rand()*900;if(Math.hypot(x-ox,y-oy)<260)continue;ctx.fillStyle='#0d2018';ctx.beginPath();ctx.ellipse(x,y+10,40+rand()*35,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#354333';ctx.beginPath();ctx.moveTo(x-25,y);ctx.lineTo(x-18,y-32-rand()*40);ctx.lineTo(x+11,y-43);ctx.lineTo(x+31,y-7);ctx.lineTo(x+21,y+6);ctx.closePath();ctx.fill();ctx.strokeStyle='#67704b66';ctx.stroke();for(let j=0;j<6;j++){ctx.strokeStyle='#496b4266';ctx.beginPath();ctx.moveTo(x-25+j*9,y+8);ctx.lineTo(x-29+j*10,y-8-rand()*18);ctx.stroke();}}
if(camp){ctx.fillStyle='#4d5741';ctx.fillRect(870,330,95,220);ctx.fillStyle='#657052';ctx.fillRect(857,327,120,24);ctx.fillStyle='#272f24';ctx.fillRect(888,355,58,168);ctx.strokeStyle='#bfaa6c77';ctx.lineWidth=2;ctx.beginPath();ctx.arc(915,316,100,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(915,316,83,.3,Math.PI*1.8);ctx.stroke();ctx.fillStyle='#cad7a2';ctx.beginPath();ctx.arc(915,316,10,0,Math.PI*2);ctx.fill();}else{for(let i=0;i<20;i++){const angle=rand()*Math.PI*2,r=175+rand()*480,x=710+Math.cos(angle)*r,y=460+Math.sin(angle)*r*.7;if(y<145||y>760)continue;ctx.fillStyle='#07170eaa';ctx.beginPath();ctx.ellipse(x,y+13,23,10,0,0,Math.PI*2);ctx.fill();if(i%4===0){ctx.fillStyle='#9e8260';ctx.fillRect(x-16,y-16,32,30);ctx.fillStyle='#e9c581';ctx.fillRect(x-6,y-7,12,4);}else if(i%4===1){ctx.fillStyle='#bda3d5';ctx.beginPath();ctx.moveTo(x,y-23);ctx.lineTo(x+15,y);ctx.lineTo(x,y+18);ctx.lineTo(x-15,y);ctx.fill();}else{ctx.fillStyle='#5f8150';ctx.beginPath();ctx.moveTo(x-17,y+10);ctx.lineTo(x-11,y-9);ctx.lineTo(x,y-17);ctx.lineTo(x+12,y-9);ctx.lineTo(x+17,y+10);ctx.fill();ctx.fillStyle='#c5d4a0';ctx.fillRect(x-7,y-3,4,4);ctx.fillRect(x+3,y-3,4,4);}if(i%4===1){ctx.strokeStyle='#fc818d';ctx.lineWidth=2;for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x-40-j*19,y+40+j*7,3,0,Math.PI*2);ctx.stroke();}}}
for(let i=0;i<35;i++){let x=450+rand()*500,y=300+rand()*430;ctx.fillStyle='#96e6b0';ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+3,y);ctx.lineTo(x,y+5);ctx.lineTo(x-3,y);ctx.fill();}
ctx.strokeStyle='#e0c27b55';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(720,470,95,64,0,0,Math.PI*2);ctx.stroke();for(let i=0;i<4;i++){let a=i*Math.PI/2+.5;ctx.fillStyle='#efd18a';ctx.save();ctx.translate(720+Math.cos(a)*95,470+Math.sin(a)*64);ctx.rotate(.4);ctx.fillRect(-5,-10,10,20);ctx.restore();}
const playerImage=characterImages[roleData[state.role].id];
if(playerImage?.complete&&playerImage.naturalWidth){ctx.drawImage(playerImage,672,394,96,96);}else{ctx.fillStyle='#9fb58a';ctx.beginPath();ctx.arc(720,445,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4c7965';ctx.beginPath();ctx.moveTo(707,455);ctx.lineTo(698,491);ctx.lineTo(720,482);ctx.lineTo(741,491);ctx.lineTo(733,455);ctx.fill();ctx.fillStyle='#182e23';ctx.fillRect(711,440,18,8);ctx.fillStyle='#edca82';ctx.fillRect(714,443,12,2);ctx.strokeStyle='#edca82';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(734,459);ctx.lineTo(758,446);ctx.stroke();}
if(roleData[state.role].id==='robot'){ctx.strokeStyle='#78b9bb88';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(720,472,34,40,0,0,Math.PI*2);ctx.stroke();}
ctx.fillStyle='#b7a16c';ctx.fillRect(1055,345,35,47);ctx.fillStyle='#536748';ctx.fillRect(1045,334,55,20);ctx.strokeStyle='#d6c38099';ctx.beginPath();ctx.ellipse(1073,370,135,90,0,0,Math.PI*2);ctx.stroke();}
ctx.fillStyle='#dfd795';for(let i=0;i<35;i++){ctx.globalAlpha=.08+rand()*.35;ctx.beginPath();ctx.arc(rand()*1440,rand()*900,rand()*2,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
const initialScreen=location.hash.slice(1);if(nav.some(([id])=>id===initialScreen))state.screen=initialScreen;
render();
</script>
